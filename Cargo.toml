[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/AS1XN/Star-Navigator"

[workspace.dependencies]
catalog = { path = "crates/catalog" }
# Only what the viewer uses; Bevy's defaults (audio, glTF, scenes, animation,
# gamepads...) roughly double the wasm size and startup time.
bevy = { version = "0.19.1", default-features = false, features = [
    "default_app",
    "std",
    "multi_threaded",
    "bevy_winit",
    "x11",
    "wayland",
    "webgl2",
    "default_font",
    "bevy_window",
    "bevy_camera",
    "bevy_color",
    "bevy_image",
    "bevy_mesh",
    "bevy_shader",
    "bevy_material",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_light",
    "bevy_pbr",
    "bevy_post_process",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "tonemapping_luts",
    "ktx2",
    "zstd_rust",
    "bevy_audio",
    "wav",
] }
stucco = "0.2.1"

# Bevy is unbearably slow in debug without optimizing dependencies.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
strip = "debuginfo"
panic = "abort"
