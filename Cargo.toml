[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/AS1XN/Star-Navigator"

[workspace.dependencies]
catalog = { path = "crates/catalog" }
bevy = "0.19.1"
stucco = "0.2.1"

# Bevy is unbearably slow in debug without optimizing dependencies.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
strip = "debuginfo"
panic = "abort"
