name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - name: Install wasm-bindgen-cli
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          if ! wasm-bindgen --version 2>/dev/null | grep -q "$version"; then
            cargo install wasm-bindgen-cli --version "$version" --locked --force
          fi
      # Optional: xtask runs wasm-opt when it's on PATH and skips it otherwise.
      - name: Install binaryen (wasm-opt)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/WebAssembly/binaryen/releases/latest \
            | grep -o 'https://[^"]*x86_64-linux.tar.gz' | head -1)
          mkdir -p "$RUNNER_TEMP/binaryen"
          curl -fsSL "$url" | tar xz -C "$RUNNER_TEMP/binaryen" --strip-components=1
          echo "$RUNNER_TEMP/binaryen/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/binaryen/bin/wasm-opt" --version
      - run: cargo xtask web
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
